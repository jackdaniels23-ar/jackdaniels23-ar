<rect x="1" y="1" width="1198" height="94" rx="12"/>
<text><tspan x="600" y="58" opacity="0">Stay low.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="0s" repeatCount="indefinite"/></tspan>
<tspan x="600" y="58" opacity="0">Think high.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="2.5s" repeatCount="indefinite"/></tspan>
<tspan x="600" y="58" opacity="0">Code everything.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="5s" repeatCount="indefinite"/></tspan>
<tspan x="600" y="58" opacity="0">Hack ethically.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="7.5s" repeatCount="indefinite"/></tspan>
<tspan x="600" y="58" opacity="0">Build responsibly.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="10s" repeatCount="indefinite"/></tspan>
<tspan x="600" y="58" opacity="0">Learn continuously.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="12.5s" repeatCount="indefinite"/></tspan>
<tspan x="600" y="58" opacity="0">There is no finish line.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="15s" repeatCount="indefinite"/></tspan>
<tspan x="600" y="58" opacity="0">Only the next challenge.<animate attributeName="opacity" values="0;1;1;0" dur="20s" begin="17.5s" repeatCount="indefinite"/></tspan></text>
